<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="vaultGradient" x1="5" y1="5" x2="43" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3ECF8E" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#3ECF8E" />
    </linearGradient>
    <filter id="vaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3ECF8E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Vault Chamber Frame -->
  <rect x="5" y="5" width="38" height="38" rx="10" stroke="url(#vaultGradient)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#vaultGlow)" />

  <!-- Vault Mechanism Dial -->
  <circle cx="24" cy="24" r="10" stroke="#3ECF8E" stroke-width="2.2" />

  <!-- Four Radial Locking Bolts -->
  <line x1="24" y1="5" x2="24" y2="14" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round" />
  <line x1="24" y1="34" x2="24" y2="43" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round" />
  <line x1="5" y1="24" x2="14" y2="24" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round" />
  <line x1="34" y1="24" x2="43" y2="24" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round" />

  <!-- Dial Index Rivets -->
  <circle cx="17" cy="17" r="1.2" fill="#3ECF8E" />
  <circle cx="31" cy="17" r="1.2" fill="#3ECF8E" />
  <circle cx="17" cy="31" r="1.2" fill="#3ECF8E" />
  <circle cx="31" cy="31" r="1.2" fill="#3ECF8E" />

  <!-- Center AI Intelligence Core -->
  <path d="M 24,18 C 24,21.3 21.3,24 18,24 C 21.3,24 24,26.7 24,30 C 24,26.7 26.7,24 30,24 C 26.7,24 24,21.3 24,18 Z" fill="url(#glowGradient)" />
</svg>
